<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini & OpenRouter Tool Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>🤖 Gemini & OpenRouter Tool Agent</h1>

    <div id="chat-box"></div>

    <div class="input-area">
        <input
            type="text"
            id="message"
            placeholder="Ask anything (e.g. Add 15 and 27 or price of iPhone 15)..."
            onkeypress="handleKeyPress(event)"
        />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function handleKeyPress(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
}

async function sendMessage() {
    const input = document.getElementById("message");
    const text = input.value.trim();

    if(!text) return;

    const chatBox = document.getElementById("chat-box");

    chatBox.innerHTML += `
        <div class="user">
            <strong>👤 You:</strong> ${escapeHtml(text)}
        </div>
    `;

    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    const loadingId = "loading-" + Date.now();
    chatBox.innerHTML += `
        <div class="bot" id="${loadingId}">
            <strong>🤖 Agent:</strong> <em>Thinking...</em>
        </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) {
            loadingElem.innerHTML = `<strong>🤖 Agent:</strong> ${escapeHtml(data.reply)}`;
        }
    } catch (err) {
        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) {
            loadingElem.innerHTML = `<strong>🤖 Agent:</strong> <span style="color:red;">Error connecting to server.</span>`;
        }
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
}
</script>

</body>
</html>
